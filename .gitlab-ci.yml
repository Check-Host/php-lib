# GitLab CI for the Check-Host PHP SDK.
#
# Sync to github.com/Check-Host/php-lib is handled by a GitLab native
# push mirror.

stages:
  - validate
  - test

variables:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "1"

# Build a Composer image once and reuse it via the cache for `vendor/`.
.composer_setup: &composer_setup
  - apk add --no-cache --quiet curl > /dev/null
  - curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer

validate:
  stage: validate
  image: php:8.3-cli-alpine
  script:
    - *composer_setup
    - composer validate --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2", "8.3", "8.4", "8.5"]
  image: php:$PHP_VERSION-cli-alpine
  script:
    - *composer_setup
    - composer install --prefer-dist --no-progress
    - php tests/test_all.php
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
