# GitLab CI for the Check-Host PHP SDK.
#
# Sync to github.com/Check-Host/php-lib is handled by a GitLab native
# push mirror.

stages:
  - validate
  - test

variables:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "1"

# Build a Composer image once and reuse it via the cache for `vendor/`.
.composer_setup: &composer_setup
  - apk add --no-cache --quiet curl > /dev/null
  - curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer

validate:
  stage: validate
  image: php:8.3-cli-alpine
  script:
    - *composer_setup
    - composer validate --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Deterministic, offline unit tests - the cURL layer is stubbed, so this
# job is unaffected by API availability or rate limits.
test:
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2", "8.3", "8.4", "8.5"]
  image: php:$PHP_VERSION-cli-alpine
  script:
    - *composer_setup
    - composer install --prefer-dist --no-progress
    - php tests/test_unit.php
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Live smoke test against the production API. Exits non-zero on failure.
# Allowed to fail so a transient API blip or rate limit doesn't block a
# release, but it still shows up in the pipeline. Single PHP version -
# the API surface doesn't vary across them.
test_live:
  stage: test
  image: php:8.3-cli-alpine
  script:
    - *composer_setup
    - composer install --prefer-dist --no-progress
    - php tests/test_all.php
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
